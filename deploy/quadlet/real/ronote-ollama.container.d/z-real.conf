# The real image in CI (docs/adr/0015-operations.md, arm-real.yml): this unit
# runs the image its own file names, which its start pulls (nothing carries it
# in the archive) within a start timeout that allows for a pull of gigabytes.
# Named to sort after ronote-.container.d/start.conf, whose Pull=never and
# five minutes would otherwise win: Quadlet applies drop-ins by file name.
[Container]
Pull=missing

[Service]
TimeoutStartSec=1500
