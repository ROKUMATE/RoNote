openapi: 3.1.0
info:
  title: RoNote API
  version: 1.0.0
  description: |
    Import documentation pages and read them back as documents. Every route
    needs a signed-in user; until real sign-in exists, dev and test inject
    RONOTE_DEV_USER_EMAIL, and staging and prod answer 401.

    Errors always use the Error envelope. Its code is stable; its message is
    for people.
servers:
  - url: /api/v1
paths:
  /imports:
    post:
      operationId: createImport
      summary: Import a page
      description: |
        Queues an import of the URL. If the user already has a document for
        it, nothing is queued and the answer is 200 with the import that made
        the document and the document's summary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportRequest"
      responses:
        "200":
          description: The user already has this page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistingImportResponse"
        "202":
          description: The import is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          description: >-
            The request or its URL is invalid. Codes: invalid_request,
            invalid_url, unsupported_scheme, url_too_long, ip_literal_host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /imports/{id}:
    get:
      operationId: getImport
      summary: Get an import
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
  /imports/{id}/events:
    get:
      operationId: getImportEvents
      summary: Follow an import's progress
      description: |
        A server-sent event stream. It sends the import's current status at
        once, then every status change, as `event: status` with an
        ImportEvent as data, and closes after done or failed. A comment line
        (`: heartbeat`) every 15 seconds keeps idle connections open.
        This handler is written by hand; the spec documents it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: status
                data: {"status":"queued"}

                event: status
                data: {"status":"done","document_id":"0192f1c4-7d3e-7c5a-9b1e-3f2a6d4c8e10"}
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents:
    get:
      operationId: listDocuments
      summary: List the user's documents, newest first
      parameters:
        - name: cursor
          in: query
          description: The next_cursor of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "400":
          description: "The cursor or limit is invalid. Codes: invalid_cursor, invalid_parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /documents/{id}:
    get:
      operationId: getDocument
      summary: Get a document with its content
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: saveDocument
      summary: Save a document's content
      description: |
        Replaces the document's content if version is still its current
        version, and answers with the new one. The content must keep the
        rules of docs/adr/0006-editor-and-doc-content.md: source blocks name
        blocks of the document's extraction, their code, tables, tabs and
        images are unchanged, an unedited source block is exactly its
        extraction block, and user blocks use only paragraph, heading, list,
        quote, callout and divider.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDocumentRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedDocument"
        "400":
          description: "The body is not a save request. Codes: invalid_request, invalid_parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The document changed since version. Code: version_conflict."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionConflict"
        "422":
          description: >-
            The content breaks a rule. Codes: invalid_content,
            unknown_source_block, source_block_modified,
            block_kind_not_allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /documents/{id}/blocks/{blockId}/revert:
    post:
      operationId: revertBlock
      summary: Put a source block back as it was extracted
      description: |
        Replaces the document's source block blockId with its extraction
        block, byte for byte, marks it unedited and bumps the version.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: blockId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document after the revert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "No such document, or no source block blockId in it. Code: not_found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: "No signed-in user. Code: unauthenticated."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No such resource for this user. Code: not_found."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidParameter:
      description: "A path or query parameter is malformed. Code: invalid_parameter."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "The server failed; the request may be retried. Code: internal_error."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
    ErrorCode:
      type: string
      description: >-
        Why a request failed. Each response lists the codes it can carry.
      enum:
        - invalid_request
        - invalid_url
        - unsupported_scheme
        - url_too_long
        - ip_literal_host
        - invalid_parameter
        - invalid_cursor
        - not_found
        - method_not_allowed
        - version_conflict
        - invalid_content
        - unknown_source_block
        - source_block_modified
        - block_kind_not_allowed
        - unauthenticated
        - internal_error
    CreateImportRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
    ImportStatus:
      type: string
      enum: [queued, fetching, extracting, done, failed]
    ImportErrorCode:
      type: string
      description: >-
        Why an import failed; set when its status is failed.
      enum:
        - invalid_url
        - blocked_address
        - disallowed_by_robots
        - too_large
        - unsupported_type
        - too_many_redirects
        - not_found
        - http_error
        - extract_failed
        - timeout
        - rate_limited
        - upstream_error
        - robots_unavailable
        - network_error
        - internal_error
    Import:
      type: object
      required: [id, requested_url, canonical_url, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        requested_url:
          type: string
        canonical_url:
          type: string
        status:
          $ref: "#/components/schemas/ImportStatus"
        error_code:
          $ref: "#/components/schemas/ImportErrorCode"
        document_id:
          type: string
          format: uuid
          description: Set when status is done.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ImportResponse:
      type: object
      required: [import]
      properties:
        import:
          $ref: "#/components/schemas/Import"
    ExistingImportResponse:
      type: object
      required: [import, document]
      properties:
        import:
          $ref: "#/components/schemas/Import"
        document:
          $ref: "#/components/schemas/DocumentSummary"
    ImportEvent:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ImportStatus"
        error_code:
          $ref: "#/components/schemas/ImportErrorCode"
        document_id:
          type: string
          format: uuid
    DocumentSummary:
      type: object
      required: [id, title, source_url, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        source_url:
          type: string
          description: The canonical URL of the page the document came from.
        version:
          type: integer
          description: Counts edits, for optimistic concurrency; starts at 1.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [content, warnings]
          properties:
            content:
              $ref: "#/components/schemas/DocContent"
            warnings:
              type: array
              description: What the extractor was unsure of when it made the document's source blocks.
              items:
                $ref: "#/components/schemas/IRWarning"
    DocumentResponse:
      type: object
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/Document"
    SaveDocumentRequest:
      type: object
      required: [content, version]
      properties:
        content:
          $ref: "#/components/schemas/DocContent"
        version:
          type: integer
          minimum: 1
          description: The version the content was edited from.
    SavedDocument:
      type: object
      required: [version]
      properties:
        version:
          type: integer
    VersionConflict:
      type: object
      required: [error, current_version]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        current_version:
          type: integer
          description: The document's version now.
    DocumentList:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
        next_cursor:
          type: string
          description: Present when there are more documents.

    # A user's document, DocContent version 1
    # (docs/adr/0006-editor-and-doc-content.md). Go uses package
    # internal/doccontent for these.
    DocContent:
      x-go-type: doccontent.Doc
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/doccontent
      type: object
      additionalProperties: false
      required: [doc_version, blocks]
      properties:
        doc_version:
          type: integer
          enum: [1]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocBlock"
    UserBlockKind:
      type: string
      description: >-
        The kinds a user block may use, nested blocks included. Source code,
        tables, tabs and images come only from the page.
      enum: [paragraph, heading, list, quote, callout, divider]
    DocBlock:
      x-go-type: doccontent.Block
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/doccontent
      type: object
      additionalProperties: false
      required: [id, kind, origin]
      description: >-
        A top-level block: an IRBlock's fields, plus where it came from.
        Source blocks set edited and source_block_id (equal to id); user
        blocks set neither, and have UUIDv7 ids. A spec test keeps these
        properties IRBlock's plus the three.
      properties:
        origin:
          type: string
          enum: [source, user]
        edited:
          type: boolean
          description: Set on source blocks only; whether the user changed the block.
        source_block_id:
          type: string
          description: Set on source blocks only; the extraction block it came from.
        id:
          type: string
        kind:
          type: string
          enum: [heading, paragraph, list, code, table, callout, image, quote, divider, tabs]
        level:
          type: integer
          minimum: 1
          maximum: 6
        anchor:
          type: string
        content:
          type: array
          items:
            $ref: "#/components/schemas/IRInline"
        ordered:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/IRItem"
        lang:
          type: string
        title:
          type: string
        title_link:
          $ref: "#/components/schemas/IRLink"
        text:
          type: string
        head:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/IRCell"
        rows:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/IRCell"
        variant:
          type: string
          enum: [note, tip, info, warning, danger]
        children:
          type: array
          items:
            $ref: "#/components/schemas/IRBlock"
        src:
          type: string
        alt:
          type: string
        caption:
          type: array
          items:
            $ref: "#/components/schemas/IRInline"
    # The IR, version 1 (docs/adr/0004-ir-and-links.md). Go uses package
    # internal/ir for these; TestIRSchemaMatchesGoldens checks they agree.
    IRDocument:
      x-go-type: ir.Doc
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [ir_version, title, source, extractor, blocks]
      properties:
        ir_version:
          type: integer
          enum: [1]
        title:
          type: string
        source:
          $ref: "#/components/schemas/IRSource"
        extractor:
          $ref: "#/components/schemas/IRExtractor"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/IRBlock"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/IRWarning"
    IRSource:
      x-go-type: ir.Source
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [url, final_url, fetched_at, body_sha256]
      properties:
        url:
          type: string
        final_url:
          type: string
        canonical_url:
          type: string
        fetched_at:
          type: string
          format: date-time
        body_sha256:
          type: string
        etag:
          type: string
        last_modified:
          type: string
    IRExtractor:
      x-go-type: ir.Extractor
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
    IRWarning:
      x-go-type: ir.Warning
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [low_confidence, parse_failed, adapter_fallback]
        message:
          type: string
    IRBlock:
      x-go-type: ir.Block
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [id, kind]
      description: >-
        One block. kind decides which other fields may be set: heading has
        level, anchor and content; paragraph content; list ordered and items;
        tabs items with labels; code lang, title, title_link and text; table
        head and rows; callout variant, title and children; quote children;
        image src, alt and caption; divider nothing.
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [heading, paragraph, list, code, table, callout, image, quote, divider, tabs]
        level:
          type: integer
          minimum: 1
          maximum: 6
        anchor:
          type: string
        content:
          type: array
          items:
            $ref: "#/components/schemas/IRInline"
        ordered:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/IRItem"
        lang:
          type: string
        title:
          type: string
        title_link:
          $ref: "#/components/schemas/IRLink"
        text:
          type: string
        head:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/IRCell"
        rows:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/IRCell"
        variant:
          type: string
          enum: [note, tip, info, warning, danger]
        children:
          type: array
          items:
            $ref: "#/components/schemas/IRBlock"
        src:
          type: string
        alt:
          type: string
        caption:
          type: array
          items:
            $ref: "#/components/schemas/IRInline"
    IRItem:
      x-go-type: ir.Item
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [children]
      properties:
        label:
          type: string
          description: Set on tabs only.
        children:
          type: array
          items:
            $ref: "#/components/schemas/IRBlock"
    IRCell:
      x-go-type: ir.Cell
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      description: A table cell's inline runs; an empty cell is null.
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/IRInline"
    IRInline:
      x-go-type: ir.Inline
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        marks:
          type: array
          items:
            type: string
            enum: [bold, italic, code, kbd, strike, sub, sup]
        link:
          $ref: "#/components/schemas/IRLink"
    IRLink:
      x-go-type: ir.Link
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/ir
      type: object
      additionalProperties: false
      required: [href, kind]
      properties:
        href:
          type: string
        kind:
          type: string
          enum: [anchor, same_domain, external]
