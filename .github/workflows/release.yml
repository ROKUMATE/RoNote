name: Release

# A v* tag builds the images of docs/adr/0014-production-topology.md for
# amd64 and arm64, pushes them to ghcr.io and attests how they were built,
# then deploys the runner to Cloudflare Pages (docs/adr/0015-operations.md)
# from the environment "production", whose required reviewer approves it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Images
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: ronote-api
            file: deploy/images/Containerfile.binary
            binary: api
          - image: ronote-worker
            file: deploy/images/Containerfile.binary
            binary: worker
          - image: ronote-web
            file: deploy/images/Containerfile.web
            binary: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both architectures build on this amd64 runner: Go cross-compiles and
      # the web files are the same everywhere, so nothing runs emulated.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rokumate/${{ matrix.image }}:${{ github.ref_name }}
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rokumate/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  runner:
    name: Runner on Cloudflare Pages
    needs: images
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the Node version
        run: make check-node-version
      - name: Install dependencies from the lockfile
        run: make web-deps
      - name: Build the app and the runner
        run: make web-build
      # The app's URL is the environment's variable, not a secret: the
      # runner's page names it, and its headers let it alone frame the runner.
      - name: Make the runner's Pages site for the app
        env:
          APP_URL: ${{ vars.RONOTE_PUBLIC_URL }}
        run: make runner-pages APP_URL="$APP_URL"
      - name: Deploy it to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: make runner-deploy
