openapi: 3.1.0
info:
  title: RoNote API
  version: 1.0.0
  description: |
    Import documentation pages and read them back as documents. Every route
    but the two that sign in needs a signed-in user: a session cookie that
    signing in with GitHub sets (docs/adr/0010-sign-in-and-sessions.md).

    Errors always use the Error envelope. Its code is stable; its message is
    for people.
servers:
  - url: /api/v1
paths:
  /auth/github/start:
    get:
      operationId: startGitHubSignIn
      summary: Start signing in with GitHub
      description: |
        Sends the browser to GitHub to sign in, with a state and a PKCE
        challenge (docs/adr/0010-sign-in-and-sessions.md). The state, the
        verifier and return_to go in a 10-minute HttpOnly cookie for the
        callback. This handler is written by hand; the spec documents it.
      parameters:
        - name: return_to
          in: query
          description: >-
            Where to go once signed in: a path on RoNote's own origin.
            Anything else, or nothing, means /.
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          description: To GitHub's sign-in page.
          headers:
            Location:
              schema:
                type: string
  /auth/github/callback:
    get:
      operationId: finishGitHubSignIn
      summary: Finish signing in with GitHub
      description: |
        Where GitHub sends the browser back. Checks the state against the
        cookie, exchanges the code with the PKCE verifier, signs the GitHub
        user in and starts a session in an HttpOnly cookie. A failure goes to
        /login?error= with a SignInErrorCode. This handler is written by
        hand; the spec documents it.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by GitHub when the user refused.
          schema:
            type: string
      responses:
        "303":
          description: >-
            Signed in, to the start's return_to; or not, to
            /login?error=<SignInErrorCode>&return_to=<return_to>.
          headers:
            Location:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /imports:
    post:
      operationId: createImport
      summary: Import a page
      description: |
        Queues an import of the URL. If the user already has a document for
        it, nothing is queued and the answer is 200 with the import that made
        the document and the document's summary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportRequest"
      responses:
        "200":
          description: The user already has this page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistingImportResponse"
        "202":
          description: The import is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          description: >-
            The request or its URL is invalid. Codes: invalid_request,
            invalid_url, unsupported_scheme, url_too_long, ip_literal_host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /imports/{id}:
    get:
      operationId: getImport
      summary: Get an import
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
  /imports/{id}/events:
    get:
      operationId: getImportEvents
      summary: Follow an import's progress
      description: |
        A server-sent event stream. It sends the import's current status at
        once, then every status change, as `event: status` with an
        ImportEvent as data, and closes after done or failed. A comment line
        (`: heartbeat`) every 15 seconds keeps idle connections open.
        This handler is written by hand; the spec documents it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: status
                data: {"status":"queued"}

                event: status
                data: {"status":"done","document_id":"0192f1c4-7d3e-7c5a-9b1e-3f2a6d4c8e10"}
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents:
    get:
      operationId: listDocuments
      summary: List the user's documents, newest first
      parameters:
        - name: cursor
          in: query
          description: The next_cursor of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "400":
          description: "The cursor or limit is invalid. Codes: invalid_cursor, invalid_parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /documents/{id}:
    get:
      operationId: getDocument
      summary: Get a document with its content
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: saveDocument
      summary: Save a document's content
      description: |
        Replaces the document's content if version is still its current
        version, and answers with the new one. The content must keep the
        rules of docs/adr/0006-editor-and-doc-content.md: source blocks name
        blocks of the document's extraction, their code, tables, tabs and
        images are unchanged, an unedited source block is exactly its
        extraction block, and user blocks use only paragraph, heading, list,
        quote, callout and divider.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDocumentRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedDocument"
        "400":
          description: "The body is not a save request. Codes: invalid_request, invalid_parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The document changed since version. Code: version_conflict."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionConflict"
        "422":
          description: >-
            The content breaks a rule. Codes: invalid_content,
            unknown_source_block, source_block_modified,
            block_kind_not_allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /documents/resolve:
    post:
      operationId: resolveDocuments
      summary: Find which links the user already has as documents
      description: |
        For each URL, canonicalized the way imports are, the user's document
        for it, if any. Answers come in request order. A URL an import would
        refuse gets neither a canonical URL nor a document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDocumentsRequest"
      responses:
        "200":
          description: One answer per URL, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedLinks"
        "400":
          description: "No URLs, or more than 200. Code: invalid_request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /documents/{id}/blocks/{blockId}/revert:
    post:
      operationId: revertBlock
      summary: Put a source block back as it was extracted
      description: |
        Replaces the document's source block blockId with its extraction
        block, byte for byte, marks it unedited and bumps the version.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: blockId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document after the revert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "No such document, or no source block blockId in it. Code: not_found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /documents/{id}/annotations:
    get:
      operationId: listAnnotations
      summary: List a document's highlights and notes
      description: |
        Every annotation of the document, oldest first. Each points into one
        block's plain text (docs/adr/0007-annotations-and-anchoring.md); the
        client anchors it in the current content, and lists the ones it
        cannot place as unplaced.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The document's annotations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationList"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAnnotation
      summary: Highlight a range of one block, with an optional note
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAnnotation"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          description: "The body is not an annotation. Codes: invalid_request, invalid_parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            The selector does not fit the document, or the document is
            full. Codes: unknown_block, quote_mismatch, annotation_limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /documents/{id}/annotations/reanchor:
    post:
      operationId: reanchorAnnotations
      summary: Move annotations to where their text is now
      description: |
        Saves new selectors for annotations of the document after its text
        changed, all or none. Each names the version it was re-anchored
        from; one stale version refuses the whole batch.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReanchorRequest"
      responses:
        "200":
          description: The annotations as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationList"
        "400":
          description: "The body is not a batch of selectors. Codes: invalid_request, invalid_parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "No such document, or an annotation that is not one of it. Code: not_found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "An annotation changed since its version. Code: version_conflict."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "A selector does not fit the document. Codes: unknown_block, quote_mismatch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /annotations/{id}:
    patch:
      operationId: updateAnnotation
      summary: Change an annotation's note, or place it on new text
      description: |
        Sets the note (an empty note removes it), or moves the annotation to
        a new range with block_id and selector together, if version is
        still the annotation's current version.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationPatch"
      responses:
        "200":
          description: The annotation as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          description: "The body is not a change. Codes: invalid_request, invalid_parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The annotation changed since version. Code: version_conflict."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionConflict"
        "422":
          description: "The selector does not fit the document. Codes: unknown_block, quote_mismatch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteAnnotation
      summary: Remove an annotation
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: "No signed-in user. Code: unauthenticated."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No such resource for this user. Code: not_found."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidParameter:
      description: "A path or query parameter is malformed. Code: invalid_parameter."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "The server failed; the request may be retried. Code: internal_error."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
    ErrorCode:
      type: string
      description: >-
        Why a request failed. Each response lists the codes it can carry.
      enum:
        - invalid_request
        - invalid_url
        - unsupported_scheme
        - url_too_long
        - ip_literal_host
        - invalid_parameter
        - invalid_cursor
        - not_found
        - method_not_allowed
        - version_conflict
        - invalid_content
        - unknown_source_block
        - source_block_modified
        - block_kind_not_allowed
        - unknown_block
        - quote_mismatch
        - annotation_limit
        - unauthenticated
        - internal_error
    Me:
      type: object
      required: [id, display_name, email, login]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
        login:
          type: string
          description: The user's GitHub login; deleting the account asks for it.
    SignInErrorCode:
      type: string
      description: >-
        Why signing in failed, in /login?error=: the user or GitHub refused
        (denied); the sign-in's cookie was missing, expired or another
        (state_mismatch); the GitHub account has no primary, verified email
        (no_verified_email); or GitHub didn't answer (provider_unavailable).
      enum:
        - denied
        - state_mismatch
        - no_verified_email
        - provider_unavailable
    CreateImportRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
    ImportStatus:
      type: string
      enum: [queued, fetching, extracting, done, failed]
    ImportErrorCode:
      type: string
      description: >-
        Why an import failed; set when its status is failed.
      enum:
        - invalid_url
        - blocked_address
        - disallowed_by_robots
        - too_large
        - unsupported_type
        - too_many_redirects
        - not_found
        - http_error
        - extract_failed
        - timeout
        - rate_limited
        - upstream_error
        - robots_unavailable
        - network_error
        - internal_error
    Import:
      type: object
      required: [id, requested_url, canonical_url, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        requested_url:
          type: string
        canonical_url:
          type: string
        status:
          $ref: "#/components/schemas/ImportStatus"
        error_code:
          $ref: "#/components/schemas/ImportErrorCode"
        document_id:
          type: string
          format: uuid
          description: Set when status is done.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ImportResponse:
      type: object
      required: [import]
      properties:
        import:
          $ref: "#/components/schemas/Import"
    ExistingImportResponse:
      type: object
      required: [import, document]
      properties:
        import:
          $ref: "#/components/schemas/Import"
        document:
          $ref: "#/components/schemas/DocumentSummary"
    ImportEvent:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ImportStatus"
        error_code:
          $ref: "#/components/schemas/ImportErrorCode"
        document_id:
          type: string
          format: uuid
    DocumentSummary:
      type: object
      required: [id, title, source_url, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        source_url:
          type: string
          description: The canonical URL of the page the document came from.
        version:
          type: integer
          description: Counts edits, for optimistic concurrency; starts at 1.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [content, warnings]
          properties:
            content:
              $ref: "#/components/schemas/DocContent"
            warnings:
              type: array
              description: What the extractor was unsure of when it made the document's source blocks.
              items:
                $ref: "#/components/schemas/IRWarning"
    ResolveDocumentsRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            maxLength: 2048
    ResolvedLinks:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedLink"
    ResolvedLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The URL as asked.
        canonical_url:
          type: string
          description: The URL canonicalized as imports do; absent when an import would refuse it.
        document_id:
          type: string
          format: uuid
          description: The user's document for it; absent when they have none.
    DocumentResponse:
      type: object
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/Document"
    SaveDocumentRequest:
      type: object
      required: [content, version]
      properties:
        content:
          $ref: "#/components/schemas/DocContent"
        version:
          type: integer
          minimum: 1
          description: The version the content was edited from.
    SavedDocument:
      type: object
      required: [version]
      properties:
        version:
          type: integer
    VersionConflict:
      type: object
      required: [error, current_version]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        current_version:
          type: integer
          description: The document's version now.
    DocumentList:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
        next_cursor:
          type: string
          description: Present when there are more documents.

    # A user's document, DocContent version 1
    # (docs/adr/0006-editor-and-doc-content.md). Go uses package
    # internal/doccontent for these.
    DocContent:
      x-go-type: doccontent.Doc
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/doccontent
      type: object
      additionalProperties: false
      required: [doc_version, blocks]
      properties:
        doc_version:
          type: integer
          enum: [1]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocBlock"
        code_langs:
          type: object
          description: >-
            The languages the user chose for code blocks, by block id, over
            the page's. Every key is the id of a code block in blocks, at
            any depth. Optional and additive, so doc_version stays 1 (ADR
            0006); the code itself never changes.
          additionalProperties:
            $ref: "#/components/schemas/CodeLang"
    CodeLang:
      type: string
      description: >-
        A language a user may choose for a code block. plaintext means no
        highlighting.
      enum: [go, python, javascript, typescript, tsx, jsx, bash, console, c, cpp, csharp, java, kotlin, rust, swift, ruby, php, sql, json, yaml, toml, ini, xml, html, css, dockerfile, makefile, markdown, diff, plaintext]
    AnnotationKind:
      type: string
      description: What an annotation is. Highlights are the one kind so far.
      enum: [highlight]
    TextSelector:
      x-go-type: annotation.Selector
      x-go-type-import:
        path: github.com/rokumate/ronote/internal/annotation
      type: object
      additionalProperties: false
      required: [position, quote]
      description: >-
        A range of one block's plain text: a heading's or paragraph's runs
        joined, or a code block's text. Offsets count UTF-16 code units, end
        exclusive. exact is the text in the range when it was saved; prefix
        and suffix, the text just around it, tell repeats apart when the
        text changes.
      properties:
        position:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start:
              type: integer
              minimum: 0
            end:
              type: integer
              minimum: 1
        quote:
          type: object
          additionalProperties: false
          required: [exact, prefix, suffix]
          properties:
            exact:
              type: string
              minLength: 1
            prefix:
              type: string
              maxLength: 32
            suffix:
