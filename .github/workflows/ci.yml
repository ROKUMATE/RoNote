name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step runs a make target; anything CI needs is a make target first
# (AGENTS.md, CI section).
jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit in the push or pull request
        run: make check-commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
      - name: Test the commit message hook with dash and GNU tools
        run: make hooks-test
      - name: Check the agent docs' sizes
        run: make lint-docs

  go:
    name: Go lint, tests and generated code
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check the Go toolchain
        run: make check-go-version
      - name: Read tool versions for cache keys
        id: versions
        run: make ci-cache-keys
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.golangci_lint }}
      - name: Install golangci-lint
        run: make tools
      - name: Lint Go code and workflows
        run: make lint-go
      - name: Run Go unit tests
        run: make test-go
      # Timing tests run on their own, one package at a time and without the
      # race detector, so other test binaries cannot slow what they measure.
      - name: Run timing tests
        run: make test-perf
      # make generate also writes the web app's API types, which needs Node.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the Node version
        run: make check-node-version
      - name: Install web dependencies from the lockfile
        run: make web-deps
      - name: Check generated code is up to date
        run: make check-generated

  integration:
    name: Postgres integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check the Go toolchain
        run: make check-go-version
      # The runner's Docker: scripts/container.sh only changes testcontainers
      # settings for a running podman machine, so Ryuk stays on here.
      - name: Run integration tests
        run: make test-integration
      # Replays recorded vectors, so no model is needed; fails when hybrid
      # search falls below testdata/retrieval/baseline.json.
      - name: Run the retrieval eval
        run: make eval

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the Node version
        run: make check-node-version
      - name: Install dependencies from the lockfile
        run: make web-deps
      - name: Lint web code
        run: make lint-web
      - name: Run web unit tests
        run: make test-web
      - name: Build, check for dev-only code and check the bundle budget
        run: make web-build

  e2e:
    name: Web end-to-end tests
    needs: web
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    services:
      # The dev stack's Postgres (deploy/compose.dev.yml), starting with the
      # empty database make web-e2e migrates.
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_USER: ronote
          POSTGRES_PASSWORD: ronote
          POSTGRES_DB: ronote_e2e
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ronote -d ronote_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make web-e2e migrates the database and builds the API and worker.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check the Go toolchain
        run: make check-go-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the Node version
        run: make check-node-version
      - name: Install dependencies from the lockfile
        run: make web-deps
      - name: Read tool versions for cache keys
        id: versions
        run: make ci-cache-keys
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}
      - name: Install Chromium and its system packages
        run: make web-browsers WITH_DEPS=1
      # The dev stack's SeaweedFS (deploy/compose.dev.yml), with its bucket:
      # a service container can't take its command. PDFs convert through
      # cmd/fakedocling, which the tests start: CI never pulls docling.
      - name: Start the blob store
        run: docker compose -f deploy/compose.dev.yml up -d --wait seaweedfs
      - name: Run end-to-end tests against the full stack
        run: make web-e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The same units on both architectures: production is Oracle's arm64
  # (docs/adr/0015-operations.md), and amd64 hosts stay supported.
  smoke:
    name: Production units smoke test (${{ matrix.runner }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A unit this runner's Quadlet rejects fails here, in seconds, with
      # Quadlet's own message, not at install.
      - name: Convert the Quadlet units with this runner's Quadlet
        run: make units-check
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the Node version
        run: make check-node-version
      - name: Install dependencies from the lockfile
        run: make web-deps
      - name: Read tool versions for cache keys
        id: versions
        run: make ci-cache-keys
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}
      - name: Install Chromium and its system packages
        run: make web-browsers WITH_DEPS=1
      # The production units, Caddy config and images, with the fakes in by
      # drop-ins (deploy/quadlet/ci), installed by deploy/install.sh under
      # their own rootless user; then only 80 and 443 may answer.
      # GitHub's runner image writes its own user's XDG_* directories into
      # /etc/environment, and pam_env hands them to ronote's systemd, whose
      # Quadlet generator then opened /home/runner's and found no units
      # (docs/adr/0014-production-topology.md). install.sh refuses that, so
      # they go before it runs. Names only are printed, but for the XDG_*
      # lines, which are directories.
      - name: Clear the runner's per-user variables before installing the units
        run: |
          echo "/etc/environment sets:"
          sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/  \1/p' /etc/environment
          sudo cp /etc/environment /etc/environment.runner
          echo "removing from /etc/environment (a copy is /etc/environment.runner):"
          grep '^XDG_' /etc/environment || true
          sudo sed -i '/^XDG_/d' /etc/environment
          if id ronote >/dev/null 2>&1; then sudo systemctl restart "user@$(id -u ronote).service"; fi
      - name: Build the images and install the units on this runner
        run: make prod-ci
      - name: Show which of the runner's variables ronote's systemd has
        if: always()
        run: |
          sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' /etc/environment.runner | sort > "$RUNNER_TEMP/runner-names"
          echo "ronote's systemd environment, names only:"
          sudo sh deploy/as-ronote.sh systemctl --user show-environment | cut -d= -f1 | sort | tee "$RUNNER_TEMP/manager-names"
          echo "of them, set in the runner's /etc/environment:"
          comm -12 "$RUNNER_TEMP/runner-names" "$RUNNER_TEMP/manager-names"
      - name: Check the example production config, and refuse a same-site runner
        run: make prod-check-config
      - name: Run the smoke suite through Caddy
        run: make prod-smoke
      # What the suite made, backed up into a restic repository on this
      # runner (R2 in production), then restored by the drill.
      - name: Back up the database and the PDFs
        run: make backup-now
      - name: Run the restore drill
        run: make restore-drill
      # CI's configuration sets no RONOTE_NTFY_URL: alerts say what they
      # would send (Caddy's local certificate is always about to expire).
      - name: Run the health watch
        run: make watch-now
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-${{ matrix.runner }}
          path: apps/web/playwright-report
          retention-days: 7
