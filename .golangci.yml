version: "2"

run:
  build-tags:
    - integration
    - live
    - perf

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - dupl
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    depguard:
      rules:
        river:
          # River is the jobs port's default adapter, and stays behind it.
          files:
            - "$all"
            - "!**/internal/jobs/riverjobs/**"
          deny:
            - pkg: github.com/riverqueue
              desc: reach River through internal/jobs; only internal/jobs/riverjobs imports it (docs/adr/0009-jobs-port.md)

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rokumate/ronote

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
