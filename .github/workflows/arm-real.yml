name: Real images on ARM

# The real docling and Ollama images, on arm64 and under the production
# memory limits (docs/adr/0014-production-topology.md's 12 GB budget), as the
# smoke jobs never run them: the fakes stand in there. The units are the
# production ones, installed through bootstrap.sh, with the fakes only for
# GitHub's sign-in and the chat model. It imports a PDF through the real
# docling, searches it by words and meaning through Ollama's embeddings, and
# reports each container's peak memory in the job's summary
# (docs/adr/0015-operations.md).
#
# Weekly and by hand. A workflow can be run by hand only once its file is on
# the default branch, so a pull request that changes this file, or what it
# runs, runs it too.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/arm-real.yml
      - deploy/quadlet/real/**
      - deploy/quadlet/ronote-docling.container
      - deploy/quadlet/ronote-pdftext.container
      - deploy/quadlet/ronote-ollama.container
      - scripts/real-images.sh
      - apps/web/smoke/real.spec.ts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real:
    name: Real docling and Ollama on arm64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the Node version
        run: make check-node-version
      - name: Install dependencies from the lockfile
        run: make web-deps
      - name: Read tool versions for cache keys
        id: versions
        run: make ci-cache-keys
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}
      - name: Install Chromium and its system packages
        run: make web-browsers WITH_DEPS=1
      # An image with no arm64 build fails here, saying which, before gigabytes
      # are pulled.
      - name: Check that the real images have arm64 builds
        run: make prod-arm64-images >> "$GITHUB_STEP_SUMMARY"
      - name: Convert the units, with the fakes and with the real images
        run: make units-check
      - name: Clear the runner's per-user variables before installing the units
        run: make ci-clear-environment
      # Docling's image is about 5 GB: the disk is what is likeliest to run out.
      - name: Show the disk and memory before the pulls
        run: |
          df -h / /home
          free -h
      - name: Install the units with the real images
        run: make prod-real
      - name: Import a PDF through the real docling, and search it
        run: make prod-real-smoke
      # Each container's peak against its limit, after the work; an OOM kill
      # or a restart fails the job, with options in the summary.
      - name: Report each container's peak memory
        if: always()
        run: make prod-memory >> "$GITHUB_STEP_SUMMARY"
      - name: Show the disk after
        if: always()
        run: df -h / /home
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm-real-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Save the units' journals
        if: failure()
        run: make prod-journals
      - name: Upload the units' journals
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm-real-journal
          path: bin/prod-journals.log
          retention-days: 7
