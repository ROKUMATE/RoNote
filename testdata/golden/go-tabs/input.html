<p>gofmt indents with tabs, and so does this example.</p>
<pre><code class="language-go">package main

import "fmt"

func main() {
	for i := 0; i &lt; 3; i++ {
		if i%2 == 0 {
			fmt.Println(i)	// even
		}
	}
}
