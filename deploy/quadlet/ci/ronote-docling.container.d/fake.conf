[Container]
Image=localhost/ronote-fakes:local
Exec=/usr/local/bin/fakedocling
Environment=RONOTE_FAKEDOCLING_ADDR=0.0.0.0:5001 RONOTE_FAKEPDFTEXT_ADDR=127.0.0.1:5012 RONOTE_FAKEDOCLING_RECORDINGS=/fakes/pdf
Secret=ronote-docling-api-key,type=env,target=RONOTE_DOCLING_API_KEY
Secret=ronote-pdftext-api-key,type=env,target=RONOTE_PDFTEXT_API_KEY
# The fakes image is distroless: no shell, nothing to check with.
HealthCmd=none
Notify=false
