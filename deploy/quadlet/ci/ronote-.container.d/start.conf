# Every unit in CI (and make prod-local): nothing is pulled, since make
# prod-config loads every image from the archive, so a missing one fails at
# once with its name; and five minutes to start, not production's fifteen.
# Not named ci.conf: a drop-in of that name in a unit's own directory (Caddy's)
# would replace this one.
[Container]
Pull=never

[Service]
TimeoutStartSec=300
