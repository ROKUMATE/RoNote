name: Real images on ARM

# The real docling and Ollama images, on arm64 and under the production
# memory limits (docs/adr/0014-production-topology.md's 12 GB budget), as the
# smoke jobs never run them: the fakes stand in there. The units are the
# production ones, installed through bootstrap.sh, with the fakes only for
# GitHub's sign-in and the chat model. It imports a PDF through the real
# docling, searches it by words and meaning through Ollama's embeddings, and
# reports each container's peak memory in the job's summary
# (docs/adr/0015-operations.md).
#
# Weekly and by hand. A workflow can be run by hand only once its file is on
# the default branch, so a pull request that changes this file, or what it
# runs, runs it too.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/arm-real.yml
      - deploy/quadlet/real/**
      - deploy/bootstrap.sh
      - deploy/pasta-apparmor.sh
      - scripts/pasta-check.sh
      - deploy/quadlet/ronote-docling.container
      - deploy/quadlet/ronote-pdftext.container
      - deploy/quadlet/ronote-ollama.container
      - deploy/quadlet/ronote-ollama-query.container
      - scripts/real-images.sh
      - apps/web/smoke/real.spec.ts
      - apps/web/smoke/worst.spec.ts
      - apps/web/scripts/worst-pdf.ts
      - deploy/backup/**
      - cmd/worker/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real:
    name: Real docling and Ollama on arm64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the Node version
        run: make check-node-version
      - name: Install dependencies from the lockfile
        run: make web-deps
      - name: Read tool versions for cache keys
        id: versions
        run: make ci-cache-keys
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}
      - name: Install Chromium and its system packages
        run: make web-browsers WITH_DEPS=1
      # A pin that is not a multi-arch index with both platforms, or that
      # podman can't read, fails here, saying which and why, before gigabytes
      # are pulled.
      - name: Check that every pinned image is a multi-arch index with arm64
        run: make prod-arm64-images
      - name: Convert the units, with the fakes and with the real images
        run: make units-check
      - name: Clear the runner's per-user variables before installing the units
        run: make ci-clear-environment
      # Oracle's host has 2 cores in all; the runner has 4. Every
      # measurement after this runs on 2, as the memory report shows.
      - name: Run ronote's units on 2 CPUs, as on Oracle's host
        run: make ci-limit-cpus
      # Docling's image is about 5 GB: the disk is what is likeliest to run out.
      - name: Show the disk and memory before the pulls
        run: |
          df -h / /home
          free -h
      # Ubuntu's AppArmor profile for pasta refuses podman's signal; bootstrap
      # adds upstream's rule (deploy/pasta-apparmor.sh). What it was before:
      - name: Show whether podman may stop pasta, before bootstrap
        run: make prod-pasta-evidence
      # Every second, each container's own cgroup: its peak, anon and file,
      # from the install's pulls to the report.
      - name: Start sampling the containers' memory
        run: make prod-memory-sampler
      - name: Install the units with the real images
        run: make prod-real
      - name: Stop and start every unit, with no AppArmor denial
        run: make prod-pasta-check
      - name: Import a PDF through the real docling, and search it
        run: make prod-real-smoke
      # From here each step runs whatever failed before it, unless the run
      # was cancelled: each measures something of its own.
      # Docling's time, anon and swap at 25, 50 and 100 pages (the cap),
      # each once with no retries, against its 540 s.
      - name: Convert 25, 50 and 100 pages through docling
        if: ${{ !cancelled() }}
        run: make prod-docling-curve
      # The worst PDF the units accept, 100 pages of code and tables (the
      # cap), timed against docling's 540 s, with searches all the while; it
      # must pass.
      - name: Import the worst accepted PDF, searching meanwhile
        if: ${{ !cancelled() }}
        run: make prod-worst-pdf
      - name: Back up the database and the PDFs
        if: ${{ !cancelled() }}
        run: make backup-now
      - name: Run the restore drill
        if: ${{ !cancelled() }}
        run: make restore-drill
      # Each container's peak against its limit, after the work; an OOM kill
      # or a restart fails the job, with options in the summary.
      - name: Report each container's peak memory
        if: ${{ !cancelled() }}
        run: make prod-memory
      - name: Report Ollama's settings
        if: ${{ !cancelled() }}
        run: make prod-ollama-settings
      # Each report is in the log already; the summary and an artifact too,
      # as gh reads the log and the artifacts but not the summary.
      - name: Put the reports in the job's summary
        if: ${{ !cancelled() }}
        run: make ci-summary
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm-real-reports
          path: bin/reports
          retention-days: 30
          if-no-files-found: warn
      - name: Show the disk after
        if: ${{ !cancelled() }}
        run: df -h / /home
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm-real-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Save the units' journals
        if: failure()
        run: make prod-journals
      - name: Upload the units' journals
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm-real-journal
          path: bin/prod-journals.log
          retention-days: 7
