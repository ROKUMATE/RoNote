version: "2"

run:
  build-tags:
    - integration
    - live
    - perf

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - dupl
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    depguard:
      rules:
        river:
          # River is the jobs port's default adapter, and stays behind it.
          files:
            - "$all"
            - "!**/internal/jobs/riverjobs/**"
          deny:
            - pkg: github.com/riverqueue
              desc: reach River through internal/jobs; only internal/jobs/riverjobs imports it (docs/adr/0009-jobs-port.md)
        anthropic:
          # Anthropic's SDK is the chat port's adapter, and stays behind it.
          files:
            - "$all"
            - "!**/internal/chat/anthropic/**"
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: reach the model through internal/chat's Model; only internal/chat/anthropic imports the SDK (docs/adr/0012-chat.md)
        aws:
          # The AWS SDK is the blob port's S3 adapter, and stays behind it.
          files:
            - "$all"
            - "!**/internal/blob/s3blob/**"
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: reach file storage through internal/blob's Store; only internal/blob/s3blob imports the AWS SDK (docs/adr/0013-pdf-import.md)

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rokumate/ronote

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
